<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WM Central</title>
    <link rel="stylesheet" href="panel.css">
</head>
<body>
<header>
    <h1>WaterManagement · Central</h1>
    <p id="connection" class="connection">Conectando…</p>
    <div class="orders">
        <label>Segundos de riego <input id="seconds" type="number" min="1" value="30"></label>
        <button type="button" id="irrigate-all">Regar todas</button>
        <button type="button" id="block-all">Bloquear todas</button>
        <button type="button" id="activate-all">Activar todas</button>
    </div>
    <p id="order-result" class="order-result"></p>
</header>
<main id="stations" class="stations"></main>
<script src="panel.js"></script>
</body>
</html>
