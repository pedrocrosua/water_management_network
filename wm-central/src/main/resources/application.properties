spring.application.name=WM_Central
server.port=8080

# SQLite database file. Override with --db.path=/data/wm.db (Docker volume).
db.path=wm.db
spring.datasource.url=jdbc:sqlite:${db.path}
# SQLite allows a single writer at a time: one connection avoids "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1

# Create the tables (schema.sql) and the initial data (data.sql) on every start.
# Both scripts are idempotent: IF NOT EXISTS / INSERT OR IGNORE.
spring.sql.init.mode=always

# The panel keeps a live stream open forever, so a "graceful" shutdown would always wait
# its full 30 s timeout. Stop at once instead: the browser reconnects by itself.
server.shutdown=immediate
