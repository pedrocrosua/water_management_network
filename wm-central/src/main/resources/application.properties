spring.application.name=WM_Central
server.port=8080

# Fichero de la base de datos SQLite. Se cambia con --db.path=/data/wm.db (volumen de Docker).
db.path=wm.db
spring.datasource.url=jdbc:sqlite:${db.path}
# SQLite solo admite un escritor a la vez: una sola conexión evita los errores "database is locked".
spring.datasource.hikari.maximum-pool-size=1

# Crea las tablas (schema.sql) y los datos iniciales (data.sql) en cada arranque.
# Se pueden repetir sin problema: IF NOT EXISTS / INSERT OR IGNORE.
spring.sql.init.mode=always

# El panel mantiene siempre un flujo abierto: un apagado "ordenado" esperaría siempre sus 30 s.
# Se apaga al momento; el navegador se reconecta solo.
server.shutdown=immediate

# Puerto al que se conecta cada WM_WS_M. Se cambia con --socket.port=5000
socket.port=5000

# Broker de Kafka. Dentro de Docker: --spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.bootstrap-servers=localhost:29092
# Un grupo de consumidores nuevo empieza por los mensajes más recientes: no repite peticiones antiguas.
spring.kafka.consumer.auto-offset-reset=latest

# Segundos que tiene una estación para confirmar que abrió la válvula antes de denegar la petición.
irrigation.answer-timeout-seconds=10
