spring.application.name=WM_FO
spring.main.web-application-type=none
spring.main.banner-mode=off

# Mandatory arguments. Example:
#   --operator.id=FO-001 --spring.kafka.bootstrap-servers=10.0.0.5:29092
operator.id=
spring.kafka.bootstrap-servers=localhost:29092
# Notifications sent while WM_FO was off are old: start with the newest ones.
spring.kafka.consumer.auto-offset-reset=latest
# Without this, Kafka's own log lines would fill the operator's menu.
logging.level.org.apache.kafka=warn
