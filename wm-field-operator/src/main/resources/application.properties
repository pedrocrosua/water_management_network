spring.application.name=WM_FO
spring.main.web-application-type=none
spring.main.banner-mode=off

# Argumentos obligatorios. Ejemplo:
#   --operator.id=FO-001 --spring.kafka.bootstrap-servers=10.0.0.5:29092
operator.id=
spring.kafka.bootstrap-servers=localhost:29092
# Las notificaciones enviadas con WM_FO apagado son antiguas: se empieza por las más recientes.
spring.kafka.consumer.auto-offset-reset=latest
# Sin esto, los logs del propio Kafka llenarían el menú del operario.
logging.level.org.apache.kafka=warn
