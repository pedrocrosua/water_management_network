# PC del laboratorio con los Field Operators. Cada operario va en su propio proyecto
# de Compose (wm-<id del operario>), así un PC puede ejecutar todos los que hagan falta.
# Cada uno se arranca en su propia terminal con el script:
#
#   ./scripts/lab-fo.sh FO-001
#
# Kafka se ejecuta en otro sitio: su dirección está en lab.env.

services:

  # Interactivo: el menú necesita su propia terminal
  operator:
    image: wm-fo:lab
    build:
      context: .
      args:
        MODULE: wm-field-operator
        APP_NAME: WM_FO
    stdin_open: true
    tty: true
    command: ["--operator.id=${OPERATOR_ID:?set OPERATOR_ID}",
              "--spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:?set KAFKA_BOOTSTRAP in lab.env}"]
    volumes:
      - ./requests:/app/requests:ro
