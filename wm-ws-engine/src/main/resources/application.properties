spring.application.name=WM_WS_E
spring.main.web-application-type=none
spring.main.banner-mode=off

# Argumentos obligatorios. Ejemplo:
#   --monitor.host=10.0.0.6 --monitor.port=6000 --spring.kafka.bootstrap-servers=10.0.0.5:29092
# El id de la estación no es un argumento: lo asigna el Monitor cuando el Engine se conecta.
monitor.host=localhost
monitor.port=6000
spring.kafka.bootstrap-servers=localhost:29092
# Copia del riego en curso; en Docker, la carpeta data es un volumen y sobrevive a una caída.
engine.backup-file=data/irrigation.json
# Las órdenes enviadas con el Engine apagado son antiguas: se empieza por las más recientes.
spring.kafka.consumer.auto-offset-reset=latest
# Si la aplicación se cae, Kafka da por muerto su consumidor en 10 s (no 45): al volver, recibe antes.
spring.kafka.consumer.properties.session.timeout.ms=10000
