spring.application.name=WM_WS_E
spring.main.web-application-type=none
spring.main.banner-mode=off

# Mandatory arguments. Example:
#   --monitor.host=10.0.0.6 --monitor.port=6000 --spring.kafka.bootstrap-servers=10.0.0.5:29092
# The station id is not an argument: the Monitor assigns it when the Engine connects.
monitor.host=localhost
monitor.port=6000
spring.kafka.bootstrap-servers=localhost:29092
# Orders sent while the Engine was off are old: start with the newest ones.
spring.kafka.consumer.auto-offset-reset=latest
