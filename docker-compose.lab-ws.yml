# PC del laboratorio con las Watering Stations. Cada estación es una pareja WM_WS_M + WM_WS_E
# que va en su propio proyecto de Compose (wm-<id de la estación>), así un PC puede
# ejecutar todas las que hagan falta. Se arrancan con el script, una terminal por aplicación:
#
#   ./scripts/lab-ws.sh monitor WS-01 "Parque de Canalejas"
#   ./scripts/lab-ws.sh engine WS-01
#
# Central y Kafka se ejecutan en otro sitio: sus direcciones están en lab.env.

services:

  monitor:
    image: wm-ws-monitor:lab
    build:
      context: .
      args:
        MODULE: wm-ws-monitor
        APP_NAME: WM_WS_M
    command: ["--engine.port=6000",
              "--central.host=${CENTRAL_HOST:?set CENTRAL_HOST in lab.env}", "--central.port=${CENTRAL_PORT:-5000}",
              "--station.id=${STATION_ID:?set STATION_ID}", "--station.location=${STATION_LOCATION:-}"]

  # Interactivo: el menú necesita su propia terminal
  engine:
    image: wm-ws-engine:lab
    build:
      context: .
      args:
        MODULE: wm-ws-engine
        APP_NAME: WM_WS_E
    stdin_open: true
    tty: true
    command: ["--monitor.host=monitor", "--monitor.port=6000",
              "--spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:?set KAFKA_BOOTSTRAP in lab.env}"]
    volumes:
      - engine-data:/app/data

volumes:
  engine-data:
