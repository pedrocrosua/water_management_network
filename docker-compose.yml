# Development: the whole system on a single machine.
#
#   docker compose up -d kafka                     # event broker
#   docker compose up -d --build wm-central        # Central + panel at http://localhost:8080
#   docker compose run --rm maven mvn -B verify    # build and test inside Docker

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for containers on this network, EXTERNAL for clients outside Docker
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${PUBLIC_HOST:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  wm-central:
    build:
      context: .
      args:
        MODULE: wm-central
        APP_NAME: WM_Central
    container_name: WM_Central
    ports:
      - "8080:8080"   # monitoring panel
      - "5000:5000"   # socket server for the WM_WS_M
    volumes:
      - wm-data:/data # the SQLite file survives restarts and rebuilds
    command: ["--socket.port=5000", "--db.path=/data/wm.db"]

  # Build tool: nothing is compiled on the host.
  # Runs with the host user's id so target/ is not left owned by root. Downloaded
  # dependencies are cached in ./.m2 (ignored by git): a named volume would be created
  # owned by root and this user could not write to it.
  maven:
    image: maven:3.9.16-eclipse-temurin-21
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    environment:
      MAVEN_CONFIG: /src/.m2
      MAVEN_OPTS: -Duser.home=/src
    volumes:
      - .:/src

volumes:
  wm-data:
